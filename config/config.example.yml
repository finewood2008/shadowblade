audio:
  Azure:
    service_region: SERVICE_REGION
    speech_key: SPEECH_KEY
  Ali:
    access_key_id: ACCESS_KEY_ID
    access_key_secret: ACCESS_KEY_SECRET
    app_key: APP_KEY
  Tencent:
    access_key_id: ACCESS_KEY_ID
    access_key_secret: ACCESS_KEY_SECRET
    app_key: APP_KEY
  provider: Azure
  local_tts:
    provider: chatTTS
    chatTTS:
      server_location: http://127.0.0.1:8080/
    GPTSoVITS:
      server_location: http://127.0.0.1:9880/
  local_recognition:
    provider: fasterwhisper
    fasterwhisper:
      # 模型档位：tiny(39MB,英文勉强可用,中文几乎不可用) /
      #          base(74MB) / small(244MB,中文推荐起步档) /
      #          medium(769MB,中文准确率更高) / large-v3(1.5GB)
      # 默认 small —— tiny 在中文上错字非常严重，不建议生产用
      model_name: small
      # 设备：cuda (有 NVIDIA GPU) / cpu
      device_type: cuda
      # 算精：cpu 用 int8；cuda 可用 float16 / int8_float16
      compute_type: int8


captioning:
  provider: Azure

llm:
  Ollama:
    api_key: YOUR_API_KEY
    base_url: http://127.0.0.1:11434/
    model_name: llama3
  DeepSeek:
    api_key: YOUR_API_KEY
    base_url: https://api.deepseek.com/
    model_name: deepseek-chat
  Baichuan:
    api_key: YOUR_API_KEY
    model_name: Baichuan3-Turbo
  Moonshot:
    api_key: YOUR_API_KEY
    model_name: moonshot-v1-8k
  Tongyi:
    api_key: YOUR_API_KEY
    model_name: qwen-turbo
  OpenAI:
    api_key: YOUR_API_KEY
    model_name: gpt-3.5-turbo
  Azure:
    api_key: YOUR_API_KEY
    base_url: http://base.url.openai
    model_name: null
  Qianfan:
    api_key: YOUR_API_KEY
    secret_key: YOUR_SK_KEY
    model_name: ERNIE-Bot-turbo
  provider: Moonshot
resource:
  pexels:
